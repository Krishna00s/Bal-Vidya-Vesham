<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1931" />
      <stop offset="100%" stop-color="#1A3D63" />
    </linearGradient>
    <linearGradient id="crest" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#B3CFE5" />
    </linearGradient>
  </defs>
  <!-- Institutional Shield Base -->
  <rect width="64" height="64" rx="14" fill="url(#bg)" />
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="#4A7FA7" stroke-width="1" opacity="0.4" />

  <!-- Ocean & Academy Crest: Open Book & Gentle Wave Monogram -->
  <g transform="translate(12, 14)">
    <!-- Open Book Pages / Academic Wings -->
    <path d="M20 28 C15 23 6 22 2 24 L2 8 C6 6 15 7 20 12 C25 7 34 6 38 8 L38 24 C34 22 25 23 20 28 Z"
          fill="none"
          stroke="url(#crest)"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round" />
    <!-- Spine Divider -->
    <line x1="20" y1="12" x2="20" y2="28" stroke="#B3CFE5" stroke-width="2" stroke-linecap="round" />
    <!-- Guiding Star / Dawn Beacon -->
    <circle cx="20" cy="5" r="2.2" fill="#FFFFFF" />
    <!-- Subtle Oceanic Ripple Line -->
    <path d="M8 32 C12 30 16 33 20 31 C24 29 28 32 32 30"
          fill="none"
          stroke="#4A7FA7"
          stroke-width="1.75"
          stroke-linecap="round" />
  </g>
</svg>
